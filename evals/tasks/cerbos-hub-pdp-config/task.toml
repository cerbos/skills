schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-hub-pdp-config"
version = "1.0.0"
description = "Switch a docker compose PDP from disk policies to a Cerbos Hub deployment, with the client secret kept out of files and the bundle cache on a persistent volume."
keywords = ["cerbos", "cerbos-hub", "custom-verifier", "pdp-configuration", "docker-compose", "secrets"]

[metadata]
difficulty = "medium"
category = "devops"
tags = ["cerbos-hub", "pdp-configuration", "secrets"]
name = "cerbos-hub-pdp-config"
description = "Switch a docker compose PDP from disk policies to a Cerbos Hub deployment, with the client secret kept out of files and the bundle cache on a persistent volume."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 180

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
