name: InvoiceTestSuite
description: Approval rules for invoices
principals:
  maria:
    id: maria
    roles: [manager]
    attr:
      managed_cost_centers: [CC-100]
      approval_limit: 5000
  sam:
    id: sam
    roles: [employee]
    attr: {}
resources:
  cc100_small:
    kind: invoice
    id: INV-1
    attr: {owner: sam, cost_center: CC-100, amount: 1200, status: submitted}
  cc100_large:
    kind: invoice
    id: INV-2
    attr: {owner: sam, cost_center: CC-100, amount: 9000, status: submitted}
  cc200_small:
    kind: invoice
    id: INV-3
    attr: {owner: sam, cost_center: CC-200, amount: 300, status: submitted}
  maria_own:
    kind: invoice
    id: INV-4
    attr: {owner: maria, cost_center: CC-100, amount: 100, status: submitted}
tests:
  - name: Manager approvals
    input:
      principals: [maria]
      resources: [cc100_small, cc100_large, cc200_small, maria_own]
      actions: [approve, view]
    expected:
      - principal: maria
        resource: cc100_small
        actions: {approve: EFFECT_ALLOW, view: EFFECT_ALLOW}
      - principal: maria
        resource: cc100_large
        actions: {approve: EFFECT_DENY, view: EFFECT_ALLOW}
      - principal: maria
        resource: cc200_small
        actions: {approve: EFFECT_DENY, view: EFFECT_ALLOW}
      - principal: maria
        resource: maria_own
        actions: {approve: EFFECT_DENY, view: EFFECT_ALLOW}
  - name: Employees view their own invoices only
    input:
      principals: [sam]
      resources: [cc100_small, maria_own]
      actions: [view, approve]
    expected:
      - principal: sam
        resource: cc100_small
        actions: {view: EFFECT_ALLOW, approve: EFFECT_DENY}
      - principal: sam
        resource: maria_own
        actions: {view: EFFECT_DENY, approve: EFFECT_DENY}
