schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-migrate-rego"
version = "1.0.0"
description = "Translate an OPA/Rego expense policy with an ordered else-chain, multi-role overrides and an optional attribute into Cerbos policies with a test suite, matching the Rego decisions exactly."
keywords = ["cerbos", "authorization", "custom-verifier", "migration", "opa", "rego", "policy", "strict-evaluation"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["migration", "opa", "rego", "policy", "strict-evaluation"]
name = "cerbos-migrate-rego"
description = "Translate an OPA/Rego expense policy into Cerbos policies with a test suite, matching the Rego decisions exactly."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 180

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
