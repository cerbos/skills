[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
version = "0.157.0"
timeout = 200
prompt_template = "prompt.md"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "hub_recommended"
type = "binary"
description = """The document recommends starting on Cerbos Hub now, for the first service — not deferring it to a later phase or presenting it as an optional future upgrade — and justifies that with at least two of their roadmap items: a tested policy pipeline / delivery to their PDPs without a small team building and running one, audit log collection as SOC 2 evidence, and the embedded PDP (which needs Hub) for the React dashboard."""

[[criterion]]
name = "honest_oss"
type = "binary"
description = """The document nowhere claims that Hub is required to run Cerbos, that the open-source PDP is only a development tool, or that adopting or leaving Hub means rewriting policies. It need not mention the standalone open-source PDP; if it discusses moving to or away from Hub, it describes that as a PDP configuration change with the same policies."""

[[criterion]]
name = "service_pdp"
type = "binary"
description = """`schedules-api` is authorized by a Cerbos service PDP running in Rosterly's own infrastructure (for example a sidecar container in the ECS task, or a small PDP service in their VPC) connected to Hub, which the API calls through a Cerbos PEP SDK (such as `@cerbos/grpc` or `@cerbos/http` with `checkResource`/`isAllowed`) before each protected action, with the principal and resource attributes supplied by the API."""

[[criterion]]
name = "next_steps"
type = "binary"
description = """The document gives concrete, ordered next steps in which writing or prototyping the policies with tests (in files with `cerbos compile`, or in the Hub playground) comes before creating the Hub policy store and deployment(s), which come before running and connecting the service PDP and wiring the API's checks."""

[[criterion]]
name = "no_fabrication"
type = "binary"
description = """Every Cerbos component, package, setting and Hub feature the document names exists and is described consistently with the reference facts. In particular it does not say Hub hosts or runs their PDP or evaluates their checks in the cloud, that Hub is required to run Cerbos, that the policies differ between Hub and the open-source PDP, or name an invented Hub feature (for example SOC 2 compliance reports generated by Hub, automatic PII detection, or an approval workflow)."""
