schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-router-envoy-hr-attributes"
version = "1.0.0"
description = "Design gateway authorization at Envoy by an attribute held only in an HR database: Synapse ext_authz plus a data source, rules in policy."
keywords = ["cerbos", "authorization", "llm-judge", "design", "routing", "synapse", "envoy", "enrichment"]

[metadata]
difficulty = "medium"
category = "design"
tags = ["router", "design", "llm-judge", "synapse", "envoy", "enrichment"]
name = "cerbos-router-envoy-hr-attributes"
description = "Design gateway authorization at Envoy by an attribute held only in an HR database: Synapse ext_authz plus a data source, rules in policy."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 600

[verifier.env]
CODEX_AUTH_JSON = "${CODEX_AUTH_JSON}"
REWARDKIT_FORCE_SUBSCRIPTION = "1"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 2048
storage_mb = 4096
