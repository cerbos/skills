schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-router-react-multitenant"
version = "1.0.0"
description = "Design Cerbos for a multi-tenant React + Express app: per-tenant scoped policies, API enforcement with a service PDP, UI gating that never enforces."
keywords = ["cerbos", "authorization", "llm-judge", "design", "routing", "multi-tenancy", "react", "embedded-pdp"]

[metadata]
difficulty = "medium"
category = "design"
tags = ["router", "design", "llm-judge", "multi-tenancy", "react", "embedded-pdp"]
name = "cerbos-router-react-multitenant"
description = "Design Cerbos for a multi-tenant React + Express app: per-tenant scoped policies, API enforcement with a service PDP, UI gating that never enforces."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 600

[verifier.env]
CODEX_AUTH_JSON = "${CODEX_AUTH_JSON}"
REWARDKIT_FORCE_SUBSCRIPTION = "1"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 2048
storage_mb = 4096
