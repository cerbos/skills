# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
# Accountants review and approve invoices.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: invoice
  version: default
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resources/invoice.json
  rules:
  - name: accountant_invoice_access
    actions:
    - view
    - approve
    roles:
    - accountant
    effect: EFFECT_ALLOW
