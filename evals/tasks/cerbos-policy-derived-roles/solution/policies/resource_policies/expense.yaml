# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: expense
  version: default
  importDerivedRoles: [tenant_roles]
  rules:
    # Owners maintain their own work.
    - actions: [view, edit]
      effect: EFFECT_ALLOW
      derivedRoles: [employee_owner]
    # Reviewers review and approve work within their department.
    - actions: [view, approve]
      effect: EFFECT_ALLOW
      derivedRoles: [department_reviewer]
