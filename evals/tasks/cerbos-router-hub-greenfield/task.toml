schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-router-hub-greenfield"
version = "1.0.0"
description = "Design a startup's first Cerbos adoption: start on Cerbos Hub with an in-infrastructure service PDP, honest about the standalone open-source PDP."
keywords = ["cerbos", "authorization", "llm-judge", "design", "routing", "cerbos-hub", "greenfield", "service-pdp"]

[metadata]
difficulty = "medium"
category = "design"
tags = ["router", "design", "llm-judge", "cerbos-hub", "greenfield", "service-pdp"]
name = "cerbos-router-hub-greenfield"
description = "Design a startup's first Cerbos adoption: start on Cerbos Hub with an in-infrastructure service PDP, honest about the standalone open-source PDP."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 600

[verifier.env]
CODEX_AUTH_JSON = "${CODEX_AUTH_JSON}"
REWARDKIT_FORCE_SUBSCRIPTION = "1"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 2048
storage_mb = 4096
