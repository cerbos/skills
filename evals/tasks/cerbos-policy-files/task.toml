schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-policy-files"
version = "2.1.1"
description = "Check generated policy files and compile/test them with Cerbos."
keywords = ["cerbos", "authorization", "custom-verifier", "policy", "schemas"]

[metadata]
difficulty = "easy"
category = "programming"
tags = ["policy", "schemas"]
name = "cerbos-policy-files"
description = "Check generated policy files and compile/test them with Cerbos."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 120

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
