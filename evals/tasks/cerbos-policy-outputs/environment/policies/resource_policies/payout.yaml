# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: payout
  version: default
  rules:
    # Finance staff review pending payouts.
    - name: view-payouts
      actions: [view]
      roles: [clerk, manager]
      effect: EFFECT_ALLOW
    # Managers release payouts up to their approval limit.
    - name: approve-within-limit
      actions: [approve]
      roles: [manager]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: R.attr.amount <= P.attr.approval_limit
    # Nobody acts on payouts from frozen accounts.
    - name: block-frozen-accounts
      actions: ["*"]
      roles: ["*"]
      effect: EFFECT_DENY
      condition:
        match:
          expr: has(R.attr.frozen) && R.attr.frozen == true
