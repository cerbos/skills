schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-migrate-pundit"
version = "1.0.0"
description = "Translate Rails Pundit policy classes with delegated and aliased queries, a suspended-account raise, guests and an early-return override into Cerbos policies with a test suite, matching Pundit's decisions exactly."
keywords = ["cerbos", "authorization", "custom-verifier", "migration", "pundit", "rails", "policy", "strict-evaluation"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["migration", "pundit", "rails", "policy", "strict-evaluation"]
name = "cerbos-migrate-pundit"
description = "Translate Rails Pundit policy classes into Cerbos policies with a test suite, matching Pundit's decisions exactly."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 180

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
