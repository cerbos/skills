schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-audit-masking"
version = "1.0.0"
description = "Write a masked PDP audit trail to a local file: PII, token claims and credential headers removed, investigation fields kept, always-allowed plan noise filtered."
keywords = ["cerbos", "authorization", "custom-verifier", "audit", "masking", "compliance"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["audit", "masking", "decision-logs", "configuration"]
name = "cerbos-audit-masking"
description = "Write a masked PDP audit trail to a local file: PII, token claims and credential headers removed, investigation fields kept, always-allowed plan noise filtered."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
