name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Validator tests
        run: uv run --no-project --with PyYAML==6.0.2 python -m unittest discover -s scripts -p 'test_*.py'

      - name: Eval verifier tests
        run: uv run --no-project --with PyYAML==6.0.2 python -m unittest discover -s evals -p 'test_*verifier.py'

      - name: Synapse tasks match their generator sources
        run: python3 evals/synapse/generate.py --check

      - name: Validate skills
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(--links)
          if [ -n "$BASE_REF" ]; then
            args+=(--base "$(git merge-base "origin/$BASE_REF" HEAD)")
          fi
          uv run --no-project --with PyYAML==6.0.2 python scripts/validate_skills.py "${args[@]}"

      - name: Outbound Cerbos links carry UTM tags
        run: python3 scripts/fix-links --check

      - name: Helper scripts parse
        run: |
          find plugins/cerbos-skills/skills -type f -perm -u+x -print0 \
            | xargs -0 -r -I{} sh -c 'head -1 "{}" | grep -q bash && bash -n "{}" && echo "ok {}" || true'
