# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: expense
  version: default
  rules:
    # Employees submit their own expenses.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles: ["employee"]
      name: employees-can-submit

    # Managers sign off small expenses (strictly under 1000).
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      roles: ["manager"]
      condition:
        match:
          expr: request.resource.attr.amount < 1000
      name: managers-approve-small-expenses

    # Finance can approve any amount.
    - actions: ["approve"]
      effect: EFFECT_ALLOW
      roles: ["finance"]
      name: finance-approves-any-amount
