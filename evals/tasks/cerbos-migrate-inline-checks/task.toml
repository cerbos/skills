schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-migrate-inline-checks"
version = "1.0.0"
description = "Move a Flask service's scattered authorization (inline role checks, a can() helper, ownership, a plan-gated feature flag and a suspended-account middleware deny) into Cerbos policies and PDP calls without changing a single status code."
keywords = ["cerbos", "authorization", "custom-verifier", "migration", "python", "flask", "pep", "strict-evaluation"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["migration", "pep", "python", "policy", "strict-evaluation"]
name = "cerbos-migrate-inline-checks"
description = "Move a Flask service's scattered authorization into Cerbos policies and PDP calls without changing a single status code."

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
