schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-policy-repair"
version = "1.0.0"
description = "Repair a document policy that fails to compile, fails a test, and silently skips a deny for an absent attribute."
keywords = ["cerbos", "authorization", "custom-verifier", "policy", "debugging", "strict-evaluation"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["policy", "debugging", "strict-evaluation"]
name = "cerbos-policy-repair"
description = "Repair a document policy that fails to compile, fails a test, and silently skips a deny for an absent attribute."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 120

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
