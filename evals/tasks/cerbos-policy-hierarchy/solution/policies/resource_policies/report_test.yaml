# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/TestSuite.schema.json
name: ReportHierarchyTest
description: Base permissions, Acme narrowing, EU residency and Globex overrides.
tests:
- name: 'base: viewer_eu on base_draft'
  input:
    principals:
    - viewer_eu
    resources:
    - base_draft
    actions:
    - view
    - edit
    - delete
  expected:
  - principal: viewer_eu
    resource: base_draft
    actions:
      view: EFFECT_ALLOW
      edit: EFFECT_DENY
