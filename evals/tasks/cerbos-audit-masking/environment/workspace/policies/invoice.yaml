# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: invoice
  version: default
  rules:
    - name: view-own
      actions: [view]
      effect: EFFECT_ALLOW
      roles: [employee]
      condition:
        match:
          expr: R.attr.owner == P.id

    - name: view-department
      actions: [view]
      effect: EFFECT_ALLOW
      roles: [manager]
      condition:
        match:
          expr: R.attr.department == P.attr.department

    - name: view-all
      actions: [view]
      effect: EFFECT_ALLOW
      roles: [auditor, admin]

    - name: approve-department
      actions: [approve]
      effect: EFFECT_ALLOW
      roles: [manager]
      condition:
        match:
          all:
            of:
              - expr: R.attr.department == P.attr.department
              - expr: R.attr.amount <= P.attr.approval_limit
              - expr: request.aux_data.jwt.mfa == true

    - name: pay
      actions: [pay]
      effect: EFFECT_ALLOW
      roles: [admin]
      condition:
        match:
          expr: R.attr.status == "approved"
