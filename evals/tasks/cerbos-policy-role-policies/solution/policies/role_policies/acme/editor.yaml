# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
# Acme departments own their content: editors edit only their department's documents.
apiVersion: api.cerbos.dev/v1
rolePolicy:
  role: editor
  scope: acme
  rules:
    - resource: document
      allowActions: [view, comment]
    - resource: document
      allowActions: [edit]
      condition:
        match:
          expr: R.attr.department == P.attr.department
