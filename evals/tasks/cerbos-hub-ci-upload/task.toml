schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-hub-ci-upload"
version = "1.0.0"
description = "Add GitHub Actions CI that validates Cerbos policies on pull requests and uploads them to a Cerbos Hub policy store from main with the store credential."
keywords = ["cerbos", "cerbos-hub", "custom-verifier", "github-actions", "ci", "policy-store"]

[metadata]
difficulty = "medium"
category = "devops"
tags = ["cerbos-hub", "github-actions", "policy-store"]
name = "cerbos-hub-ci-upload"
description = "Add GitHub Actions CI that validates Cerbos policies on pull requests and uploads them to a Cerbos Hub policy store from main with the store credential."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 2048
storage_mb = 4096
