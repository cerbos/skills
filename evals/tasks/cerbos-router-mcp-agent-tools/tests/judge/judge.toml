[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
version = "0.157.0"
timeout = 200
prompt_template = "prompt.md"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "check_in_tool_path"
type = "binary"
description = """Every tool call is authorized on the MCP server side — in the tool handler or a wrapper/middleware that every tool call passes through — by a Cerbos check (Python SDK `is_allowed`/`check_resources` against a PDP) made before the tool runs, with a denial returned to the agent instead of running the tool. Filtering the tool list (in the agent or in `list_tools`) may be added, but a design whose only control is filtering, or whose check runs only in the agent process, fails this criterion."""

[[criterion]]
name = "user_is_principal"
type = "binary"
description = """The Cerbos principal for each tool call is the staff member the assistant acts for — `id` and `roles` taken from the verified Okta bearer token on the request — not the assistant, an agent identity, or the helpdesk service account, and not identity or role values supplied by the model in tool arguments or the conversation."""

[[criterion]]
name = "rules_in_policy"
type = "binary"
description = """The rules are Cerbos policies: tools modelled as a resource (and/or the underlying ticket records) with actions per tool, delete tools allowed only to `support_lead` and `admin` (through `delete_*`, a namespaced wildcard such as `delete:*` with the tool names mapped onto those actions, or an explicit rule, provided the document says it covers future delete tools), read/update tools for every support role, deny by default, with policy tests; and the "update only tickets assigned to them" change is described as a policy condition on a resource attribute supplied by the MCP server, not as Python code."""

[[criterion]]
name = "avoid_list"
type = "binary"
description = """The document explicitly tells the team to avoid BOTH (1) relying on the system prompt or the model to refuse disallowed tool calls, and (2) authorizing tool calls as the assistant/agent or the helpdesk service account instead of the human user."""

[[criterion]]
name = "next_steps"
type = "binary"
description = """The document gives concrete, ordered next steps in which writing the Cerbos tool policy with tests (including a support agent denied the delete tools) comes before the MCP server's tool-call path starts enforcing the Cerbos check, and the steps include running a PDP for the MCP server with Cerbos Hub or another stated way for policy changes to reach it without an MCP server release (preparatory steps such as gathering requirements or inventorying tools may come first; the PDP may be deployed before or after the MCP server is wired)."""

[[criterion]]
name = "no_fabrication"
type = "binary"
description = """Every Cerbos component, package, API and configuration the document names exists and is described consistently with the reference facts. In particular it does not invent an MCP-specific Cerbos product, agent SDK or gateway, does not claim the PDP fetches ticket or user records itself, and does not misdescribe what an embedded PDP or Synapse does if it mentions them."""
