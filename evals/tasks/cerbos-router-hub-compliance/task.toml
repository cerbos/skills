schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv"] }]

[task]
name = "cerbos/cerbos-router-hub-compliance"
version = "1.0.0"
description = "Design an auditor-ready decision trail for production PDPs: Hub audit log collection with PDP-side masking and searchable history, PDPs kept in-cluster."
keywords = ["cerbos", "authorization", "llm-judge", "design", "routing", "cerbos-hub", "audit", "compliance", "masking"]

[metadata]
difficulty = "medium"
category = "design"
tags = ["router", "design", "llm-judge", "cerbos-hub", "audit", "compliance", "masking"]
name = "cerbos-router-hub-compliance"
description = "Design an auditor-ready decision trail for production PDPs: Hub audit log collection with PDP-side masking and searchable history, PDPs kept in-cluster."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 600

[verifier.env]
CODEX_AUTH_JSON = "${CODEX_AUTH_JSON}"
REWARDKIT_FORCE_SUBSCRIPTION = "1"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 2048
storage_mb = 4096
