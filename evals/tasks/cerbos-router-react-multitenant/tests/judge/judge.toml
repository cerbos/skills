[judge]
judge = "codex"
model = "openai/gpt-5.6-luna"
version = "0.157.0"
timeout = 200
prompt_template = "prompt.md"

[scoring]
aggregation = "all-pass"

[[criterion]]
name = "tenant_rules_in_policy"
type = "binary"
description = """Per-customer rule differences (Acme, Globex, future customers) are expressed as Cerbos policies — scoped policies with a scope per tenant layered over shared default rules, or separate Hub policy stores per tenant — and the design says how a check selects the tenant (for example `resource.scope` or `principal.scope` set from the tenant ID). Tenant rules kept in application code, a database table/JSON column, or feature flags fail this criterion."""

[[criterion]]
name = "api_enforces"
type = "binary"
description = """The Express API authorizes each mutating endpoint (at least approve, edit and delete) on the server by calling a Cerbos PDP (a service PDP through a Cerbos SDK such as `@cerbos/grpc`/`@cerbos/http`, with `checkResource(s)`/`isAllowed`) before acting, returns a denial when Cerbos denies, and the document presents this server-side check as the enforcement point / source of truth."""

[[criterion]]
name = "ui_from_cerbos_presentational"
type = "binary"
description = """Button visibility in the React app comes from Cerbos decisions over the same policies — either an embedded PDP in the browser (Hub ePDP rule, `@cerbos/embedded-client`) or permissions the API computes with a batched Cerbos `checkResources` call and returns with the data — without a request per row, AND the document states that the browser-side decision only controls what is rendered and never replaces the API's check."""

[[criterion]]
name = "avoid_list"
type = "binary"
description = """The document explicitly tells the team to avoid BOTH (1) hard-coding role or tenant rules in application code — React components, Express routes, or a helper that duplicates the policy (rejecting any one of these phrasings satisfies part 1) — and (2) treating the browser/UI check as enforcement or skipping the API check because the UI already decided."""

[[criterion]]
name = "next_steps"
type = "binary"
description = """The document gives concrete, ordered next steps in which writing the Cerbos policies (including per-tenant scopes) with policy tests comes before wiring the API's server-side PDP checks, which comes before the UI permission checks (preparatory steps such as gathering requirements or inventorying endpoints may come first); and somewhere in the document it names Cerbos Hub as how policy changes reach the PDPs across the three environments."""

[[criterion]]
name = "no_fabrication"
type = "binary"
description = """Every Cerbos component, package, API and configuration the document names exists and is described consistently with the reference facts. In particular it does not: invent products, packages or features (e.g. a tenant manager, a React guard library, attribute drivers); claim the PDP loads users, invoices or tenant data from a database or IdP; claim an embedded PDP works without Cerbos Hub; or put Hub client credentials in browser code or `VITE_` variables."""
