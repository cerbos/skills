schema_version = "1.3"
artifacts = [{ source = "/workspace", destination = "workspace", exclude = [".agents", ".codex", ".claude", ".git", ".cache", ".pytest_cache", ".ruff_cache", "__pycache__", "*.pyc", "node_modules", ".venv", "dist", ".vite"] }]

[task]
name = "cerbos/cerbos-epdp-react"
version = "1.0.0"
description = "Gate React buttons with an embedded PDP loaded from a Hub ePDP rule while the API keeps enforcing with a service PDP."
keywords = ["cerbos", "authorization", "custom-verifier", "llm-judge", "embedded-pdp", "react", "vite", "wasm"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["embedded-pdp", "react", "vite", "hub", "llm-judge"]
name = "cerbos-epdp-react"
description = "Gate React buttons with an embedded PDP loaded from a Hub ePDP rule while the API keeps enforcing with a service PDP."

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 600

[verifier.env]
CODEX_AUTH_JSON = "${CODEX_AUTH_JSON}"
REWARDKIT_FORCE_SUBSCRIPTION = "1"

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 2048
storage_mb = 4096
