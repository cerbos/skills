# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: document
  version: default
  # BUG: common_roles is never imported here (no importDerivedRoles), so the
  # `owner` derived role referenced below never activates.
  rules:
    # Readers and writers may view documents.
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["reader", "writer"]
      name: readers-and-writers-view
    # Writers may edit documents.
    - actions: ["edit"]
      effect: EFFECT_ALLOW
      roles: ["writer"]
      name: writers-edit
    # Intended: owners delete their own documents — but the owner derived role is
    # never imported, so this rule grants nothing.
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner"]
      name: owner-deletes-own-document
