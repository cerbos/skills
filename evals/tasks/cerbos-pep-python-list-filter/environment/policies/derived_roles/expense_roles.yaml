# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/Policy.schema.json
apiVersion: api.cerbos.dev/v1
description: Relationship roles for expense reports.
derivedRoles:
  name: expense_roles
  definitions:
    - name: report_owner
      parentRoles: ["employee", "manager", "finance"]
      condition:
        match:
          expr: R.attr.owner == P.id
